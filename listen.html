<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<title>BGM Listen</title>
<style>
  :root{--bg:#eaf4fc;--card:#fff;--ink:#16324a;--sub:#5d7a92;--on:#2f9bd6;--line:#cfe2f1}
  @media (prefers-color-scheme:dark){:root{--bg:#10202e;--card:#182d3f;--ink:#e6f1fa;--sub:#93aec4;--on:#4db3ec;--line:#27445a}}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif}
  main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:22px;margin:0 0 4px} p.note{margin:0 0 20px;color:var(--sub);font-size:14px;line-height:1.6}
  .song{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;margin:0 0 12px;padding:16px 18px;background:var(--card);border:2px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
  .song:hover{border-color:var(--on)} .song.on{border-color:var(--on);box-shadow:0 0 0 3px color-mix(in srgb,var(--on) 25%,transparent)}
  .song .ico{font-size:28px;width:36px;text-align:center}
  .song b{display:block;font-size:18px} .song small{display:block;color:var(--sub);margin-top:2px}
  .row{display:flex;align-items:center;gap:12px;margin:18px 0 0;color:var(--sub);font-size:14px} .row input[type=range]{flex:1}
  button.stop{margin-top:12px;padding:10px 22px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  #status{margin-top:14px;font-size:14px;color:var(--sub);min-height:1.4em}
  iframe{position:fixed;left:0;bottom:0;width:2px;height:2px;border:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>BGM を聴く</h1>
  <p class="note">マップごとの BGM を、ここで切り替えて聴けます(確認用の、一時的なページです)。ボタンを押すと、その曲が頭から鳴ります。</p>
  <button class="song" data-map="yokohama"><span class="ico">&#127769;</span><span><b>Yokohama Station</b><small>yokohama_night_developed.mid ・ テンポ162 ・ 約71秒 ・ 音量とドラムを強めた版</small></span></button>
  <button class="song" data-map="minato"><span class="ico">&#127750;</span><span><b>Minato Mirai</b><small>neon_return_ep_faint.mid ・ テンポ108 ・ 約71秒</small></span></button>
  <button class="song" data-map="chinatown"><span class="ico">&#127982;</span><span><b>Yamashita</b><small>手作りの中華ポップ ・ テンポ102 ・ 約42秒</small></span></button>
  <div class="row"><span>音量</span><input id="vol" type="range" min="0" max="200" value="100"><span id="volv">100%</span></div>
  <button class="stop" id="stop">&#9632; 止める</button> <button class="stop" id="resume" style="display:none">&#9654; 再生</button>
  <div id="status"></div>
  <div style="margin-top:18px;font-size:12px;color:var(--sub)">ページの版: <span id="ver"></span>(古い表示のときは、再読み込みしてください)</div>
</main>
<iframe id="game" allow="autoplay" title="game"></iframe>
<script>
const $=id=>document.getElementById(id), game=$('game'); let cur=null;
function status(t){ $('status').textContent=t; }
function applyVol(){ const w=game.contentWindow; try{ w.eval("if(typeof BGM!=='undefined'&&BGM.bus) BGM.bus.gain.value="+(.29*$('vol').value/100)); }catch(_){} $('volv').textContent=$('vol').value+'%'; }   // ゲーム側の BGM は const なので、eval で触る
function acState(){ try{ return game.contentWindow.eval("(typeof AC!=='undefined'&&AC)?AC.state:'none'"); }catch(_){ return 'none'; } }
function kick(){                                           // 音声を、確実に動かす(ボタンを押した瞬間の操作から、呼ぶ)
  const w=game.contentWindow;
  try{ w.audioInit(); w.eval("if(AC&&AC.state==='suspended') AC.resume()"); }catch(e){ return false; }
  return true;
}
function showState(){
  if(!cur) return;
  const st=acState(), name=document.querySelector('.song.on b').textContent;
  if(st==='running'){ status('再生中: '+name); $('resume').style.display='none'; }
  else{ status('準備できました(音声: '+st+')。音が出ない場合は、「▶ 再生」を押してください: '+name); $('resume').style.display='inline-block'; }
}
function play(map){
  hardStop(); cur=map; document.querySelectorAll('.song').forEach(b=>b.classList.toggle('on',b.dataset.map===map));
  status('読み込み中...'); $('resume').style.display='none';
  game.onload=()=>{
    if(!cur || game.getAttribute('src')==='about:blank' || !game.contentWindow.audioInit) return;      // 止めたあとの空のページや、読み込み途中では、何もしない
    kick();
    let n=0; const t=setInterval(()=>{ applyVol(); if(++n>20) clearInterval(t); },150);
    setTimeout(showState,600);
  };
  game.src='index.html?map='+map+'&dev=1&listen='+Date.now();
}
document.querySelectorAll('.song').forEach(b=>b.onclick=()=>play(b.dataset.map));
function hardStop(){                                       // 止める: 曲のタイマーを止め、音声を閉じてから、ゲームのページも空にする
  cur=null;
  try{ game.contentWindow.eval("try{ if(typeof BGM!=='undefined'){ clearInterval(BGM.timer); BGM.timer=0; if(BGM.out) BGM.out.gain.value=0; } if(AC){ AC.close(); } }catch(e){}"); }catch(_){}
  game.onload=null; game.src='about:blank';
}
$('stop').onclick=()=>{ hardStop(); document.querySelectorAll('.song').forEach(b=>b.classList.remove('on')); status('止めました'); };
$('vol').oninput=applyVol;
$('ver').textContent='2026-10-17 横浜駅の音量・ドラム強化版';
$('resume').onclick=()=>{ kick(); setTimeout(showState,300); };       // ブラウザが、自動で音を出させないときの、手動の再生
</script>
</body>
</html>
